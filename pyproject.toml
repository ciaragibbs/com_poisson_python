[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "com_poisson"
version = "0.1.0"
description = "Adaptive filtering for Conway-Maxwell-Poisson distributions (neuronal spike data analysis)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["statistics", "neuroscience", "CMP", "Conway-Maxwell-Poisson", "spike train"]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "matplotlib>=3.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["com_poisson*"]
